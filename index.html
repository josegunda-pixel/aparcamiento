<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hueco · plazas libres en la calle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9edf1; --card:#ffffff; --ink:#14202b; --muted:#5b6b7a; --line:#d3dbe3;
  --blue:#0a4ea3; --blue-ink:#ffffff; --free:#16844a; --free-bg:#dff3e7; --warn:#a65b00; --warn-bg:#fbeacc;
  --danger:#b3261e; --ring:#c4cfda;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e151d; --card:#17212c; --ink:#e8eef4; --muted:#93a4b5; --line:#2a3947;
    --blue:#5aa0f2; --blue-ink:#071522; --free:#52d58d; --free-bg:#12301f; --warn:#f0b04e; --warn-bg:#352408;
    --danger:#ff8a80; --ring:#2e3f50; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e151d; --card:#17212c; --ink:#e8eef4; --muted:#93a4b5; --line:#2a3947;
  --blue:#5aa0f2; --blue-ink:#071522; --free:#52d58d; --free-bg:#12301f; --warn:#f0b04e; --warn-bg:#352408;
  --danger:#ff8a80; --ring:#2e3f50; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
.sign{flex:none;width:46px;height:46px;border-radius:10px;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center;font:700 32px/1 "Barlow Condensed",system-ui,sans-serif;border:3px solid var(--blue-ink);outline:2px solid var(--blue)}
h1{margin:0;font:700 30px/1 "Barlow Condensed",system-ui,sans-serif;letter-spacing:.2px}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tab{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px 10px;font:700 22px/1.1 "Barlow Condensed",system-ui,sans-serif;cursor:pointer;min-height:64px}
.tab small{display:block;font:500 13px/1.3 "Barlow",system-ui,sans-serif;color:var(--muted);margin-top:3px}
.tab[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.tab[aria-selected="true"] small{color:var(--blue-ink);opacity:.85}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.panel[hidden]{display:none}
label{display:block;font-weight:600;margin:12px 0 6px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 18px;min-height:52px;font:700 20px/1 "Barlow Condensed",system-ui,sans-serif;cursor:pointer;background:var(--blue);color:var(--blue-ink);text-decoration:none}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:44px;padding:10px 14px;font-size:18px}
.btn.bad{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}
.hint{color:var(--muted);font-size:14px;margin:10px 0 0}
.where{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.pill{display:inline-block;font-size:13px;font-weight:600;border-radius:99px;padding:3px 10px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--free-bg);color:var(--free);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.radar{display:block;width:100%;height:auto;max-height:300px;margin:6px auto 14px}
.spot{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;background:var(--card)}
.spot.mine{border-color:var(--blue)}
.spot .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.spot .calle{font:700 21px/1.15 "Barlow Condensed",system-ui,sans-serif}
.spot .meta{color:var(--muted);font-size:14px;margin-top:2px}
.dist{flex:none;text-align:right;font:700 24px/1 "Barlow Condensed",system-ui,sans-serif;color:var(--free)}
.dist small{display:block;font:500 12px/1.2 "Barlow",system-ui,sans-serif;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{text-align:center;padding:26px 8px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 22px/1.2 "Barlow Condensed",system-ui,sans-serif;margin-bottom:4px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:12px;font-weight:600;transform:translateY(140%);transition:transform .25s}
.toast.show{transform:none}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.banner[hidden]{display:none}
.gps{background:var(--warn-bg);color:var(--ink);border:2px solid var(--warn);border-radius:14px;padding:14px;margin-bottom:14px}
.gps[hidden]{display:none}
.gps b{display:block;font:700 22px/1.15 "Barlow Condensed",system-ui,sans-serif}
.gps p{margin:4px 0 12px;font-size:14px}
.city{margin:0 0 14px}.city label{margin:0 0 6px;color:var(--muted);font-size:14px}.city select{font:700 22px/1.1 "Barlow Condensed",system-ui,sans-serif;min-height:54px;border:2px solid var(--blue)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="sign" aria-hidden="true">P</div>
    <div>
      <h1>Hueco</h1>
      <p class="sub">Plazas libres en la calle, avisadas por quien se va</p>
    </div>
  </header>

  <div class="city"><label for="ciudad">Ciudad</label><select id="ciudad"></select></div>
  <div class="banner" id="banner" hidden></div>
  <div class="gps" id="gps" hidden></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-voy" aria-selected="false" aria-controls="p-voy">Me voy<small>Dejo mi plaza libre</small></button>
    <button class="tab" role="tab" id="tab-busco" aria-selected="true" aria-controls="p-busco">Busco plaza<small>Plazas libres ahora</small></button>
  </div>

  <section class="panel" id="p-voy" role="tabpanel" aria-labelledby="tab-voy" hidden>
    <div class="where" id="where-voy"></div>
    <label for="calle">Calle y número (aprox.)</label>
    <input id="calle" type="text" placeholder="Ej.: Calle Mayor, 12" autocomplete="off" maxlength="80">
    <label for="zona">Si no tienes GPS, elige tu zona</label>
    <select id="zona"></select>
    <p class="hint">Cuando salgas, pulsa el botón. La plaza se muestra 20 minutos a quien busca cerca.</p>
    <div style="height:14px"></div>
    <button class="btn block" id="btn-voy">Me voy, plaza libre</button>
    <div id="mis"></div>
  </section>

  <section class="panel" id="p-busco" role="tabpanel" aria-labelledby="tab-busco">
    <div class="where" id="where-busco"></div>
    <svg class="radar" id="radar" viewBox="0 0 300 300" role="img" aria-label="Plazas libres alrededor de ti"></svg>
    <div id="lista"></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var VIDA_MS = 20*60*1000;       // una plaza libre dura 20 min
  var RESERVA_MS = 5*60*1000;     // "Voy" la guarda 5 min
  var ZGZ = [
    ["Centro / Plaza España",41.6504,-0.8800],["Casco Histórico / Pilar",41.6561,-0.8773],
    ["Delicias",41.6558,-0.9066],["Universidad / San Francisco",41.6420,-0.8990],
    ["Actur / Rey Fernando",41.6812,-0.8924],["San José",41.6420,-0.8700],
    ["Las Fuentes",41.6560,-0.8615],["Torrero",41.6335,-0.8725],
    ["Arrabal / Picarral",41.6743,-0.8730],["Oliver / Valdefierro",41.6393,-0.9249]
  ];
  var ZONAS = ZGZ;
  var CIUDADES = [
    ["A Coruña",43.3623,-8.4115],["Albacete",38.9943,-1.8585],["Alcalá de Henares",40.4820,-3.3635],["Alicante",38.3452,-0.4810],
    ["Almería",36.8381,-2.4597],["Ávila",40.6564,-4.6818],["Badajoz",38.8794,-6.9707],["Badalona",41.4500,2.2474],
    ["Barcelona",41.3874,2.1686],["Benidorm",38.5411,-0.1225],["Bilbao",43.2630,-2.9350],["Burgos",42.3439,-3.6969],
    ["Cáceres",39.4753,-6.3724],["Cádiz",36.5271,-6.2886],["Cartagena",37.6257,-0.9966],["Castellón de la Plana",39.9864,-0.0513],
    ["Ceuta",35.8894,-5.3213],["Ciudad Real",38.9863,-3.9291],["Córdoba",37.8882,-4.7794],["Cuenca",40.0704,-2.1374],
    ["Elche",38.2699,-0.7126],["Ferrol",43.4845,-8.2328],["Getafe",40.3057,-3.7320],["Gijón",43.5322,-5.6611],
    ["Girona",41.9794,2.8214],["Granada",37.1773,-3.5986],["Guadalajara",40.6333,-3.1667],["Huelva",37.2614,-6.9447],
    ["Huesca",42.1401,-0.4089],["Jaén",37.7796,-3.7849],["Jerez de la Frontera",36.6850,-6.1261],["L'Hospitalet de Llobregat",41.3596,2.0997],
    ["Las Palmas de Gran Canaria",28.1235,-15.4363],["León",42.5987,-5.5671],["Lleida",41.6176,0.6200],["Logroño",42.4627,-2.4450],
    ["Lugo",43.0097,-7.5568],["Madrid",40.4168,-3.7038],["Málaga",36.7213,-4.4214],["Marbella",36.5101,-4.8825],
    ["Melilla",35.2923,-2.9381],["Mérida",38.9161,-6.3437],["Murcia",37.9922,-1.1307],["Ourense",42.3358,-7.8639],
    ["Oviedo",43.3614,-5.8593],["Palencia",42.0096,-4.5288],["Palma",39.5696,2.6502],["Pamplona",42.8125,-1.6458],
    ["Pontevedra",42.4310,-8.6444],["Sabadell",41.5463,2.1086],["Salamanca",40.9701,-5.6635],["San Sebastián",43.3183,-1.9812],
    ["Santa Cruz de Tenerife",28.4636,-16.2518],["Santander",43.4623,-3.8100],["Santiago de Compostela",42.8782,-8.5448],["Segovia",40.9429,-4.1088],
    ["Sevilla",37.3891,-5.9845],["Soria",41.7664,-2.4790],["Tarragona",41.1189,1.2445],["Terrassa",41.5632,2.0089],
    ["Teruel",40.3456,-1.1065],["Toledo",39.8628,-4.0273],["Valencia",39.4699,-0.3763],["Valladolid",41.6523,-4.7245],
    ["Vigo",42.2406,-8.7207],["Vitoria-Gasteiz",42.8467,-2.6716],["Zamora",41.5035,-5.7446],["Zaragoza",41.6488,-0.8891]
  ].map(function(c){
    return {id:c[0].normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),n:c[0],lat:c[1],lng:c[2]};
  }).sort(function(a,b){ return a.n.localeCompare(b.n,"es"); });
  var RADIO_CIUDAD = 40000;       // metros: hasta aquí el GPS cuenta como "de esa ciudad"
  function getC(id){ return CIUDADES.filter(function(c){return c.id===id;})[0]||null; }
  function cercana(lat,lng){
    var best=null;
    CIUDADES.forEach(function(c){ var d=dist({lat:lat,lng:lng},c); if(!best||d<best.d) best={c:c,d:d}; });
    return best;
  }
  function zonasDe(c){
    if(c.id==="zaragoza") return ZGZ;
    var d=0.013;
    return [["Centro",c.lat,c.lng],["Norte",c.lat+d,c.lng],["Sur",c.lat-d,c.lng],["Este",c.lat,c.lng+d*1.3],["Oeste",c.lat,c.lng-d*1.3]];
  }

  var state = { gpsErr:null, me:null, spots:[], uid:null, db:null, col:null, local:false, tab:"busco", ciudad:"zaragoza", manual:false };
  var $ = function(id){ return document.getElementById(id); };

  function esc(s){ var d=document.createElement("div"); d.textContent=String(s==null?"":s); return d.innerHTML; }
  function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("show");},3200); }

  function dist(a,b){
    var R=6371000, r=Math.PI/180;
    var dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
    var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return 2*R*Math.asin(Math.sqrt(x));
  }
  function fmtDist(m){ return m<1000 ? Math.round(m/10)*10+" m" : (m/1000).toFixed(1).replace(".",",")+" km"; }
  function hace(ts){ var m=Math.floor((Date.now()-ts)/60000); return m<1?"ahora mismo":"hace "+m+" min"; }

  // ---------- ciudad y zonas ----------
  function llenarZonas(){
    var s=$("zona"); s.innerHTML="";
    var o=document.createElement("option"); o.value=""; o.textContent="Usar mi ubicación"; s.appendChild(o);
    ZONAS.forEach(function(z,i){ var op=document.createElement("option"); op.value=i; op.textContent=z[0]; s.appendChild(op); });
  }
  function llenarCiudades(){
    var s=$("ciudad");
    CIUDADES.forEach(function(c){ var op=document.createElement("option"); op.value=c.id; op.textContent=c.n; s.appendChild(op); });
  }
  function setCiudad(id,manual,keepMe){
    var c=getC(id)||getC("zaragoza");
    state.ciudad=c.id; if(manual) state.manual=true;
    ZONAS=zonasDe(c); llenarZonas(); $("ciudad").value=c.id;
    document.title="Hueco · plazas libres en "+c.n;
    try{ localStorage.setItem("hueco-ciudad",c.id); }catch(e){}
    if(keepMe){ renderAll(); return; }
    if(state.me && state.me.fuente==="gps" && dist(state.me,c)<RADIO_CIUDAD) renderAll();
    else setMe(c.lat,c.lng,c.n+" (centro)","zona");
  }

  // ---------- ubicación ----------
  function setMe(lat,lng,label,fuente,acc){ state.me={lat:lat,lng:lng,label:label,fuente:fuente,acc:acc||null,dir:null}; renderAll(); }
  function aDireccion(lat,lng){
    try{
      fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=es&lat="+lat+"&lon="+lng)
        .then(function(r){ return r.json(); })
        .then(function(j){
          var a=j.address||{};
          var calle=a.road||a.pedestrian||a.footway||a.path||a.neighbourhood||"";
          var d=calle ? calle+(a.house_number?", "+a.house_number:"") : (j.display_name||"").split(",").slice(0,2).join(",").trim();
          if(d && state.me && state.me.fuente==="gps"){
            state.me.dir=d;
            var c=$("calle"); if(c && !c.value) c.value=d;
            renderAll();
          }
        }).catch(function(){});
    }catch(e){}
  }
  function renderGps(){
    var el=$("gps"); if(!el) return;
    if(state.me && state.me.fuente==="gps"){ el.hidden=true; return; }
    el.hidden=false;
    var txt = state.gpsErr || "Así te mostramos las plazas libres más cercanas. Al pulsar, el navegador te pedirá permiso: elige «Permitir».";
    el.innerHTML='<b>Activa tu GPS mientras uses la app</b><p>'+esc(txt)+'</p><button class="btn block" data-act="gps" type="button">Activar GPS</button>';
  }
  function pedirGps(){
    function fallo(msg,e){ state.gpsErr=msg+(e?" (código "+e.code+(e.message?": "+e.message:"")+")":""); whereMsg("Sin GPS","warn"); renderGps(); }
    if(!window.isSecureContext){ fallo("El GPS solo funciona en páginas https. Mientras tanto, elige tu zona en «Me voy»."); return; }
    if(!navigator.geolocation){ fallo("Este navegador no tiene GPS. Elige tu zona en «Me voy»."); return; }
    state.gpsErr="Buscando tu ubicación…"; renderGps();
    function ok(p){
      state.gpsErr=null;
      setMe(p.coords.latitude,p.coords.longitude,"Tu ubicación","gps",Math.round(p.coords.accuracy||0));
      aDireccion(p.coords.latitude,p.coords.longitude);
      if(!state.manual){
        var c=cercana(p.coords.latitude,p.coords.longitude);
        if(c && c.d<RADIO_CIUDAD && c.c.id!==state.ciudad){ setCiudad(c.c.id,false,true); toast("Ciudad: "+c.c.n); }
      }
    }
    function error(e){
      if(e && e.code===1){
        fallo(/policy|disabled/i.test(e.message||"")
          ? "Esta pantalla no puede usar el GPS. Abre la página directamente en Safari o Chrome, o elige tu zona."
          : "Permiso denegado. Actívalo para este sitio: iPhone, botón aA > Ajustes del sitio web > Ubicación. Android, candado > Permisos > Ubicación. Luego pulsa de nuevo.",e);
      } else {
        fallo("No hay señal de ubicación. Comprueba que la ubicación del teléfono está activada y pulsa de nuevo.",e);
      }
    }
    navigator.geolocation.getCurrentPosition(ok, function(e){
      if(e && e.code===1){ error(e); return; }
      navigator.geolocation.getCurrentPosition(ok, error, {enableHighAccuracy:false,timeout:15000,maximumAge:60000});
    }, {enableHighAccuracy:true,timeout:8000,maximumAge:30000});
  }
  function whereMsg(t,cls){ ["where-voy","where-busco"].forEach(function(id){ $(id).innerHTML='<span class="pill '+(cls||"")+'">'+esc(t)+'</span>'; }); }
  function renderWhere(){
    if(!state.me) return;
    var t = state.me.fuente==="gps" ? "Estás en: "+(state.me.dir||"ubicación por GPS")+(state.me.acc?" (±"+state.me.acc+" m)":"") : "Zona: "+state.me.label;
    ["where-voy","where-busco"].forEach(function(id){
      $(id).innerHTML='<span class="pill ok">'+esc(t)+'</span><button class="btn ghost small" data-act="gps" type="button">Usar GPS</button>';
    });
  }

  // ---------- datos ----------
  function estadoEfectivo(s){
    var now=Date.now();
    if(s.estado==="ocupada") return "ocupada";
    if(now-s.ts>VIDA_MS) return "caducada";
    if(s.estado==="reservada" && s.reservadaTs && now-s.reservadaTs<RESERVA_MS) return "reservada";
    return "libre";
  }
  function visibles(){
    var arr=state.spots.map(function(s){ s._e=estadoEfectivo(s); s._d=(state.me&&s.lat!=null)?dist(state.me,s):null; return s; })
      .filter(function(s){ return (s.ciudad||"zaragoza")===state.ciudad && (s._e==="libre"||s._e==="reservada"); });
    arr.sort(function(a,b){
      if(a._d!=null&&b._d!=null) return a._d-b._d;
      return b.ts-a.ts;
    });
    return arr;
  }

  function guardar(id,data,merge){
    if(state.local){
      var s=state.spots.filter(function(x){return x.id===id;})[0];
      if(s&&merge) Object.assign(s,data); else if(!s) state.spots.push(Object.assign({id:id},data));
      renderAll(); return Promise.resolve();
    }
    var ref=state.col.doc(id);
    return (merge?ref.update(data):ref.set(data)).catch(function(e){
      if(e&&e.code==="invalid_argument"){ toast("Tu acceso es solo de lectura: no puedes publicar ni reservar."); }
      else if(e&&e.code==="quota_exceeded"){ toast("La base de datos está llena. Prueba más tarde."); }
      else { toast("No se pudo guardar. Inténtalo otra vez."); }
      throw e;
    });
  }

  // ---------- acciones ----------
  function publicar(){
    var calle=$("calle").value.trim();
    var zi=$("zona").value;
    var pos=null, origen="";
    if(zi!==""){ var z=ZONAS[+zi]; pos={lat:z[1]+(Math.random()-.5)*0.003,lng:z[2]+(Math.random()-.5)*0.003}; origen=z[0]; }
    else if(state.me&&state.me.fuente==="gps"){ pos={lat:state.me.lat,lng:state.me.lng}; origen="GPS"; }
    if(!pos){ pedirGps(); toast("Necesito tu ubicación: permite el GPS o elige tu zona."); return; }
    if(!calle){ $("calle").focus(); toast("Escribe la calle para que te encuentren."); return; }
    var ciu=state.ciudad;
    if(!zi){ var cc=cercana(pos.lat,pos.lng); if(cc && cc.d<RADIO_CIUDAD) ciu=cc.c.id; }
    if(ciu!==state.ciudad) setCiudad(ciu,false,true);
    var id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    var btn=$("btn-voy"); btn.disabled=true;
    guardar(id,{calle:calle,ciudad:ciu,lat:pos.lat,lng:pos.lng,zona:origen,ts:Date.now(),estado:"libre",by:state.uid},false)
      .then(function(){ $("calle").value=""; toast("Plaza publicada. Se muestra 20 minutos."); renderAll(); })
      .catch(function(){})
      .then(function(){ btn.disabled=false; });
  }
  function accion(act,id){
    if(act==="voy"){
      guardar(id,{estado:"reservada",reservadaPor:state.uid,reservadaTs:Date.now()},true).then(function(){ toast("Plaza guardada 5 minutos para ti."); }).catch(function(){});
    } else if(act==="ocupada"){
      guardar(id,{estado:"ocupada"},true).then(function(){ toast("Gracias. Plaza marcada como ocupada."); }).catch(function(){});
    } else if(act==="retirar"){
      guardar(id,{estado:"ocupada"},true).then(function(){ toast("Aviso retirado."); }).catch(function(){});
    } else if(act==="liberar"){
      guardar(id,{estado:"libre",reservadaPor:null,reservadaTs:0},true).catch(function(){});
    }
  }

  // ---------- render ----------
  function renderRadar(arr){
    var svg=$("radar"), C=150, MAXR=140, MAXM=500;
    var h='';
    [100,250,500].forEach(function(m){ var r=MAXR*m/MAXM; h+='<circle cx="'+C+'" cy="'+C+'" r="'+r+'" fill="none" stroke="var(--ring)" stroke-width="1.5" stroke-dasharray="4 5"/>'; h+='<text x="'+(C+r*0.71+3)+'" y="'+(C-r*0.71-2)+'" font-size="11" fill="var(--muted)">'+m+' m</text>'; });
    h+='<line x1="'+C+'" y1="6" x2="'+C+'" y2="294" stroke="var(--ring)"/><line x1="6" y1="'+C+'" x2="294" y2="'+C+'" stroke="var(--ring)"/>';
    h+='<text x="'+C+'" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">N</text>';
    if(state.me){
      arr.forEach(function(s,i){
        if(s._d==null) return;
        var r=Math.min(s._d,MAXM)/MAXM*MAXR;
        var ang=Math.atan2(s.lng-state.me.lng,s.lat-state.me.lat);
        var x=C+Math.sin(ang)*r, y=C-Math.cos(ang)*r;
        var col=s._e==="reservada"?"var(--warn)":"var(--free)";
        h+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="11" fill="'+col+'"/><text x="'+x.toFixed(1)+'" y="'+(y+4.5).toFixed(1)+'" text-anchor="middle" font-size="13" font-weight="700" fill="var(--card)">'+(i+1)+'</text>';
      });
      h+='<circle cx="'+C+'" cy="'+C+'" r="8" fill="var(--blue)" stroke="var(--card)" stroke-width="3"/>';
    }
    svg.innerHTML=h;
  }

  function spotHtml(s,i){
    var mine = s.by===state.uid;
    var reservadaPorMi = s._e==="reservada" && s.reservadaPor===state.uid;
    var reservadaOtro = s._e==="reservada" && !reservadaPorMi;
    var badge = reservadaPorMi ? '<span class="pill ok">Guardada para ti</span>' : reservadaOtro ? '<span class="pill warn">Alguien va hacia allí</span>' : '<span class="pill ok">Libre</span>';
    var distHtml = s._d!=null ? '<div class="dist">'+fmtDist(s._d)+'<small>de ti</small></div>' : '';
    var nav = 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(s.lat+','+s.lng)+'&travelmode=driving';
    var a='';
    if(!reservadaPorMi && !reservadaOtro) a+='<button class="btn small" data-act="voy" data-id="'+esc(s.id)+'" type="button">Voy</button>';
    if(reservadaPorMi) a+='<button class="btn ghost small" data-act="liberar" data-id="'+esc(s.id)+'" type="button">Ya no voy</button>';
    a+='<a class="btn ghost small" href="'+nav+'" target="_blank" rel="noopener">Cómo llegar</a>';
    if(mine) a+='<button class="btn bad small" data-act="retirar" data-id="'+esc(s.id)+'" type="button">Retirar</button>';
    else a+='<button class="btn bad small" data-act="ocupada" data-id="'+esc(s.id)+'" type="button">Ya está ocupada</button>';
    return '<div class="spot'+(mine?' mine':'')+'"><div class="top"><div><div class="calle">'+(i+1)+'. '+esc(s.calle)+'</div><div class="meta">'+hace(s.ts)+(mine?' · la has publicado tú':'')+'</div><div style="margin-top:8px">'+badge+'</div></div>'+distHtml+'</div><div class="actions">'+a+'</div></div>';
  }

  function renderLista(){
    var arr=visibles();
    renderRadar(arr);
    var el=$("lista");
    if(!arr.length){
      el.innerHTML='<div class="empty"><b>Ahora no hay plazas avisadas</b>Cuando alguien pulse «Me voy», aparecerá aquí al momento. Esta pantalla se actualiza sola.</div>';
      return;
    }
    el.innerHTML=arr.map(spotHtml).join("");
  }
  function renderMis(){
    var mias=visibles().filter(function(s){return s.by===state.uid;});
    $("mis").innerHTML = mias.length ? '<p class="hint">Tienes '+mias.length+' aviso'+(mias.length>1?'s':'')+' activo'+(mias.length>1?'s':'')+'. Puedes retirarlos desde «Busco plaza».</p>' : '';
  }
  function renderAll(){ renderWhere(); renderLista(); renderMis(); renderGps(); }

  // ---------- pestañas y eventos ----------
  function setTab(t){
    state.tab=t;
    $("tab-voy").setAttribute("aria-selected",t==="voy");
    $("tab-busco").setAttribute("aria-selected",t==="busco");
    $("p-voy").hidden=t!=="voy"; $("p-busco").hidden=t!=="busco";
  }
  function pedirSiHaceFalta(){ if(!state.me || (state.me.fuente!=="gps" && $("zona").value==="")) pedirGps(); }
  $("tab-voy").addEventListener("click",function(){setTab("voy"); pedirSiHaceFalta();});
  $("tab-busco").addEventListener("click",function(){setTab("busco");});
  $("btn-voy").addEventListener("click",publicar);
  $("ciudad").addEventListener("change",function(){ setCiudad(this.value,true); });
  $("zona").addEventListener("change",function(){
    var v=this.value;
    if(v===""){ pedirGps(); }
    else { var z=ZONAS[+v]; setMe(z[1],z[2],z[0],"zona"); }
  });
  document.body.addEventListener("click",function(e){
    var b=e.target.closest("[data-act]"); if(!b) return;
    var act=b.getAttribute("data-act");
    if(act==="gps"){ state.manual=false; $("zona").value=""; pedirGps(); return; }
    accion(act,b.getAttribute("data-id"));
  });
  setInterval(renderAll,20000);

  // ---------- arranque ----------
  function localId(){
    try{ var k=localStorage.getItem("hueco-uid"); if(!k){ k="u"+Math.random().toString(36).slice(2,10); localStorage.setItem("hueco-uid",k); } return k; }
    catch(e){ return "u"+Math.random().toString(36).slice(2,10); }
  }
  async function init(){
    state.uid=localId();
    llenarCiudades();
    var g=null; try{ g=localStorage.getItem("hueco-ciudad"); }catch(e){}
    setCiudad(getC(g)?g:"zaragoza",false,true);
    pedirGps();
    var db=null, user=null;
    try{ if(window.claude&&claude.use){ db=await claude.use("db"); user=await claude.use("user"); } }catch(e){}
    if(user){ try{ state.uid=await user.id(); }catch(e){} }
    if(!db){
      state.local=true;
      var b=$("banner"); b.hidden=false;
      b.textContent="Modo de prueba: las plazas solo se ven en este móvil. Abre la app desde su enlace, con sesión iniciada, para compartirlas.";
      renderAll(); return;
    }
    state.db=db; state.col=db.collection("plazas");
    var desde=Date.now()-60*60*1000;
    state.col.where("ts",">",desde).orderBy("ts","desc").limit(500).onSnapshot(function(snap){
      state.spots=snap.docs.map(function(d){ var v=d.data(); v.id=d.id; return v; });
      renderAll();
    }, function(){
      var b=$("banner"); b.hidden=false; b.textContent="No se pudo conectar con las plazas compartidas. Recarga la página.";
    });
  }
  init();
})();
</script>
</body>
</html>
